<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1040px" preserveAspectRatio="none" style="width:429px;height:1040px;background:#FFFFFF;" version="1.1" viewBox="0 0 429 1040" width="429px" zoomAndPan="magnify"><defs/><g><ellipse cx="214.9454" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="199.7853" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="287.1339" x="71.3784" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="145.645" x="81.3784" y="72.8281">Defini&#231;&#245;es Parametricas</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.216" x="227.0235" y="72.8281">:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.1772" x="87.6185" y="89.1722">Wavelength              = 633 nm</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142.969" x="87.6185" y="105.5163">Largura                 = 60 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.9412" x="87.6185" y="121.8604">Numero de Pontos        = 128</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.4813" x="87.6185" y="138.2045">Distancia de Propaca&#231;&#227;o = 60 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="81.3784" y="154.5487">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="257.7738" x="87.6185" y="170.8928">X = -Largura/2 : Largura/2, Numero de Pontos</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="257.5338" x="87.6185" y="187.2369">Y = -Largura/2 : Largura/2, Numero de Pontos</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="6.2401" x="81.3784" y="203.581">&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.2533" x="87.6185" y="219.9251">Deslocamento de EM      = 40 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.7413" x="87.6185" y="236.2692">Step de Deslocamento    = 0.1 um</text><rect fill="#F1F1F1" height="150.7529" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.3892" x="121.2508" y="269.7853"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="152.2931" x="131.2508" y="292.6133">Defini&#231;&#245;es de Localiza&#231;&#227;o</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.216" x="283.5439" y="292.6133">:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117.4089" x="137.4908" y="308.9575">Fonte              = 0  um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.485" x="137.4908" y="325.3016">Beam Splitter (BS) = 30 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.321" x="137.4908" y="341.6457">Espelho Fixo  (EF) = 40 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.0291" x="137.4908" y="357.9898">Espelho M&#243;vel (EM) = 39 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.7249" x="137.4908" y="374.3339">Detector           = 30 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="131.2508" y="390.678">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.8571" x="137.4908" y="407.0221">Raio dos Espelhos = 12 um</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.1486" x="160.3711" y="440.5382"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="67.8244" x="170.3711" y="463.3663">Inclina&#231;&#245;es</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.216" x="238.1955" y="463.3663">:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.2525" x="176.6111" y="479.7104">Teta do EF = 0</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="82.9086" x="176.6111" y="496.0545">Teta do EM = 0</text><rect fill="#F1F1F1" height="150.7529" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="401.7348" x="14.078" y="529.5705"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="295.7541" x="24.078" y="552.3986">Parametriza&#231;&#227;o Geom&#233;tricas da Fonte de Luz LED</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.216" x="319.8321" y="552.3986">:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.7127" x="30.318" y="568.7427">Diametro = 50 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="85.6206" x="30.318" y="585.0868">Raio     = 25 um</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="133.237" x="30.318" y="601.4309">Numero de Pontos = 24</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="371.2106" x="30.318" y="617.7751">Teta[] = 0: 180, distribuidos entre 24 partes igualmente espa&#231;adas</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="359.3546" x="30.318" y="634.1192">r[]    = 0:raio, distribuidos entre 24 partes igualmente espa&#231;adas</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="375.4948" x="30.318" y="650.4633">Feixe_X[] = Coordenas Cartesinas das Coordenadas polares r,Theta</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="375.2548" x="30.318" y="666.8074">Feixe_Y[] = Coordenas Cartesinas das Coordenadas polares r,Theta</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.2738" x="78.3085" y="700.3234"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="253.2738" x="88.3085" y="723.1515">Configura&#231;&#227;o dos Feixes do LED em Z+step</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.4538" x="78.2185" y="756.6675"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="253.4538" x="88.2185" y="779.4956">Config. e Prop. dos Feixes sobre os &#211;pticos</text><rect fill="#F1F1F1" height="118.0647" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="407.8908" x="11" y="813.0117"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="95.3527" x="21" y="835.8397">Interferometria</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.216" x="116.3527" y="835.8397">:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.0852" x="27.2401" y="852.1839">MM &#233; refletido de volta ao BS</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.4292" x="27.2401" y="868.528">MF &#233; refletido de volta ao BS</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="21" y="884.8721">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.3129" x="27.2401" y="901.2162">Detecotr = (MM+MF)/2</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="381.6507" x="27.2401" y="917.5603">Intensidade no Detector = np.abs(u_detector.RS(z=z_detector).u)**2</text><rect fill="#F1F1F1" height="36.3441" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="84.2845" x="172.8032" y="951.0763"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.2845" x="182.8032" y="973.9044">Next action</text><ellipse cx="214.9454" cy="1018.4205" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="214.9454" cy="1018.4205" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="214.9454" x2="214.9454" y1="30" y2="50"/><polygon fill="#181818" points="210.9454,40,214.9454,50,218.9454,40,214.9454,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="214.9454" x2="214.9454" y1="249.7853" y2="269.7853"/><polygon fill="#181818" points="210.9454,259.7853,214.9454,269.7853,218.9454,259.7853,214.9454,263.7853" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="214.9454" x2="214.9454" y1="420.5382" y2="440.5382"/><polygon fill="#181818" points="210.9454,430.5382,214.9454,440.5382,218.9454,430.5382,214.9454,434.5382" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="214.9454" x2="214.9454" y1="509.5705" y2="529.5705"/><po